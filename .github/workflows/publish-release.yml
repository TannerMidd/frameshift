name: Publish offline-signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a draft semantic-version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH."
          }
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw "Draft release $tag was not found." }
          $release = $json | ConvertFrom-Json
          if ($release.tagName -ne $tag -or -not $release.isDraft) {
            throw "$tag is not an unpublished draft release."
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned production verifier dependency
        run: python -m pip install -r source/requirements.txt

      - name: Download the exact draft release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          New-Item -ItemType Directory -Path candidate | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir candidate `
            --pattern "Frameshift.exe" `
            --pattern "EliteTrader.exe" `
            --pattern "Frameshift-update.json" `
            --pattern "Frameshift-update.json.sig"
          if ($LASTEXITCODE -ne 0) { throw "Could not download all signed draft assets." }
          foreach ($name in @(
            "Frameshift.exe",
            "EliteTrader.exe",
            "Frameshift-update.json",
            "Frameshift-update.json.sig"
          )) {
            if (-not (Test-Path -LiteralPath "candidate/$name" -PathType Leaf)) {
              throw "Required draft asset is missing: $name"
            }
          }

      - name: Verify offline signature and both executable digests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.Trim().Substring(1)
          python source/tools/verify_release_manifest.py `
            --version $version `
            --manifest candidate/Frameshift-update.json `
            --signature candidate/Frameshift-update.json.sig `
            --asset candidate/Frameshift.exe `
            --asset candidate/EliteTrader.exe
          if ($LASTEXITCODE -ne 0) { throw "Offline release signature verification failed." }

      - name: Publish the verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (-not $json.isDraft) { throw "$tag is no longer a draft release." }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish verified release $tag." }
