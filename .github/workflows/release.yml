name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned frontend tools
        run: npm ci --no-audit --no-fund

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py elite tests

      - name: Enforce backend architecture budgets
        run: |
          python tools/check_backend_architecture.py --self-test
          python tools/check_backend_architecture.py

      - name: Run Python lint gate
        run: python -m ruff check app.py elite tests tools

      - name: Run Python type gate
        run: python -m mypy

      - name: Run frontend static and unit gates
        run: npm run verify:frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run browser journeys
        run: npm run test:e2e:ci

      - name: Run Python suite with coverage
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m coverage erase
          $failed = @()
          Get-ChildItem tests -Filter "test_*.py" | Sort-Object Name | ForEach-Object {
            Write-Host "== $($_.Name)"
            python -m coverage run --parallel-mode tools/run_python_test_file.py $_.FullName
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $failed += $_.Name
              Write-Host "::error file=tests/$($_.Name),title=Python test failed::$($_.Name) exited with code $exitCode"
            }
          }
          if ($failed.Count -gt 0) { throw "Failing tests: $($failed -join ', ')" }
          python -m coverage combine
          if ($LASTEXITCODE -ne 0) { throw "Coverage data could not be combined." }
          python -m coverage report
          if ($LASTEXITCODE -ne 0) { throw "Python coverage is below the configured threshold." }

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must match vMAJOR.MINOR.PATCH"
          }
          "VERSION = `"$v`"" | Out-File -FilePath elite/_version.py -Encoding ascii
          $fvers = (($v.Split('.') + @('0','0','0','0'))[0..3]) -join ','
          (Get-Content packaging/version_info.txt -Raw).Replace('@FILEVERS@', $fvers).Replace('@VERSION@', $v) |
            Out-File -FilePath version_info.rendered.txt -Encoding ascii
          Write-Host "Stamped version $v (filevers $fvers)"

      # A proper Windows version resource (ProductName/version/etc.) can lower
      # antivirus heuristic noise. Publisher authenticity is established later
      # by the owner's offline Ed25519 signature, not by a paid certificate.
      - name: Build Frameshift.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Frameshift
          --version-file version_info.rendered.txt
          --icon assets/Frameshift.ico
          --add-data "ui;ui"
          --add-data "elite/data/engineering_catalog.json.gz;elite/data"
          --add-data "THIRD_PARTY_NOTICES.md;."
          --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          app.py

      # Pre-rename installs (Elite Trader, <= v1.16.0) look for an asset named
      # exactly "EliteTrader.exe" - publishing the same binary under both names
      # keeps their auto-update working. Remove the legacy copy only if the
      # old-install population ever demonstrably hits zero.
      - name: Checksums + legacy-named copy
        shell: pwsh
        run: |
          Copy-Item dist/Frameshift.exe dist/EliteTrader.exe
          foreach ($name in @("Frameshift.exe", "EliteTrader.exe")) {
            $h = (Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower()
            $h | Out-File -FilePath "dist/$name.sha256" -Encoding ascii -NoNewline
            Write-Host "sha256 $name $h"
          }

      - name: Smoke test (headless server answers)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Frameshift.exe -ArgumentList "--headless","--port","8699"
          Start-Sleep -Seconds 12
          $version = "${{ github.ref_name }}".TrimStart("v")
          python tools/verify_served_ui.py http://127.0.0.1:8699 --expected-version $version

      # This job never receives the release private key. The owner downloads
      # these draft candidates, signs their exact bytes offline, and uploads the
      # manifest/signature. publish-release.yml verifies them before publishing.
      - name: Create unsigned draft release candidate
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          draft: true
          files: |
            dist/Frameshift.exe
            dist/Frameshift.exe.sha256
            dist/EliteTrader.exe
            dist/EliteTrader.exe.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
